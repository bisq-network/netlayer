name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Windows PowerShell splits -Dkey.with.dots=value arguments, so every platform uses bash.
    shell: bash

env:
  JAVA_DISTRIBUTION: zulu
  JAVA_VERSION: '21.0.11'

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # tor.native ships a separate Tor binary per platform, so every supported platform is built and tested.
        # macos-15 is arm64; macos-15-intel keeps Intel macOS coverage explicit.
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Compiles all modules, runs the unit tests and builds the jar and javadoc jar of every module.
      - name: Build with Maven
        run: mvn -B -ntp -V verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  # Starts two bundled Tor instances, publishes two onion services and exchanges messages between them over the Tor
  # network. This verifies that the Tor binary of each platform can be extracted, started and used, which the unit
  # tests do not cover. The job depends on the public Tor network, so a failure can also be caused by the network.
  tor-integration:
    name: Tor peer message test on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15-intel, macos-15, windows-2025 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run peer message test app
        run: mvn -B -ntp -V -pl tor.native -am -DskipTests -Ppeer-message-test-app verify

  # Consumers get netlayer from JitPack. Without a Maven wrapper in the repository, JitPack generates a Maven 3.6.3
  # wrapper and runs `clean install -DskipTests`. This job repeats those steps so that a release that JitPack cannot
  # build fails here first.
  jitpack:
    name: JitPack build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Java JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # `install` writes the netlayer artifacts to the local repository; keep them out of the shared cache.
          cache-read-only: true

      - name: Build like JitPack
        run: |
          if [ ! -f mvnw ]; then
            mvn -B -ntp -N wrapper:wrapper -Dmaven=3.6.3
          fi
          ./mvnw -B -ntp -V clean install -DskipTests
